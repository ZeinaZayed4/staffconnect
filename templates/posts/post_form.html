{% extends "base.html" %}

{% block title %}{% if object %}Edit{% else %}New{% endif %} Announcement | StaffConnect{% endblock %}

{% block content %}
<section class="form-card">
    <h1>{% if object %}Edit{% else %}New{% endif %} announcement</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="button">{% if object %}Save changes{% else %}Publish{% endif %}</button>
        <a href="{% if object %}{{ object.get_absolute_url }}{% else %}{% url 'posts:home' %}{% endif %}">Cancel</a>
    </form>
</section>
{% endblock %}
